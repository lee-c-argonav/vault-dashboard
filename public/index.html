<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#08090A">
<title>VAULT-HUD</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./hud.css">
<!-- After hud.css deliberately. tokens.css owns the state encoding for both
     surfaces; loading it last means a rule left behind in hud.css loses rather
     than silently reinstating the old encoding on one surface only. -->
<link rel="stylesheet" href="./tokens.css">
</head>
<body>

<!-- Icon sprite. Drawn rather than fetched: no external host, works offline, and
     built from the same primitives as the rest of the panel (hairline strokes,
     square caps, circles/squares/triangles, zero curves except true circles). -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <!-- Every horizontal and vertical edge sits on a .5 coordinate so a 1px
         stroke lands on a pixel centre and stays crisp at 16px. -->
    <symbol id="ic-git" viewBox="0 0 16 16">
      <circle cx="4.5" cy="4" r="2"/>
      <circle cx="4.5" cy="12" r="2"/>
      <circle cx="11.5" cy="8" r="2"/>
      <path d="M4.5 6v4"/>
      <path d="M6.5 8.5h3"/>
    </symbol>
    <symbol id="ic-window" viewBox="0 0 16 16">
      <rect x="2.5" y="3.5" width="11" height="9"/>
      <path d="M2.5 6.5h11"/>
    </symbol>
    <symbol id="ic-gem" viewBox="0 0 16 16">
      <path d="M8 2.5L13.5 8 8 13.5 2.5 8z"/>
      <path d="M8 2.5v11"/>
    </symbol>
    <symbol id="ic-terminal" viewBox="0 0 16 16">
      <rect x="2.5" y="3.5" width="11" height="9"/>
      <path d="M5 6.5l2 2-2 2"/>
      <path d="M8.5 10.5h3"/>
    </symbol>
    <symbol id="ic-code" viewBox="0 0 16 16">
      <path d="M6 4.5L2.5 8 6 11.5"/>
      <path d="M10 4.5L13.5 8 10 11.5"/>
    </symbol>
    <symbol id="ic-bolt" viewBox="0 0 16 16">
      <path d="M9.5 2.5L3.5 8.5h3.5l-.5 5 6-6H9z"/>
    </symbol>
    <symbol id="ic-triangle" viewBox="0 0 16 16">
      <path d="M8 3L13.5 12.5h-11z"/>
    </symbol>
    <symbol id="ic-vault" viewBox="0 0 16 16">
      <rect x="2.5" y="2.5" width="11" height="11"/>
      <circle cx="8" cy="8" r="2.5"/>
      <path d="M8 2.5v3"/>
      <path d="M8 10.5v3"/>
    </symbol>
  </defs>
</svg>

<header class="head panel" id="p-head">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <span class="wordmark">VAULT-HUD</span>
    <span class="brand-sub"><span id="h-vault">—</span><i>·</i><span id="h-date">—</span><i>·</i><span id="h-day">—</span></span>
  </div>

  <nav class="shortcuts" id="shortcuts" aria-label="Shortcuts"></nav>

  <div class="readout" id="h-readout">
    <!-- Agent work, not todos. These five were OPEN/STALE/DUE/OVER/DONE, every one
         of them read from a todo system that is no longer used, on a panel whose
         subject changed to agent runs on 2026-08-06. -->
    <div class="cell"><span class="cell-k">RUNS</span><span class="cell-v" id="s-runs">--</span></div>
    <div class="cell"><span class="cell-k">SESSIONS</span><span class="cell-v" id="s-sessions">--</span></div>
    <div class="cell"><span class="cell-k">AGENTS RUNNING</span><span class="cell-v" id="s-agents">--</span></div>
    <div class="cell"><span class="cell-k">STALLED</span><span class="cell-v" id="s-stalled">--</span></div>
    <div class="cell"><span class="cell-k">NEEDS YOU</span><span class="cell-v" id="s-needs">--</span></div>
  </div>
</header>

<!-- Machine vitals. Its own SSE stream, its own cadence, and it renders nothing
     it cannot measure: a cell with no reading hides rather than showing a zero. -->
<section class="vitals panel" id="p-vitals">
  <div class="vit" id="v-cpu" hidden>
    <span class="vit-k">CPU</span>
    <span class="vit-v" id="v-cpu-n">--</span>
    <span class="vit-bar"><i id="v-cpu-b"></i></span>
  </div>
  <div class="vit" id="v-gpu" hidden>
    <span class="vit-k">GPU</span>
    <span class="vit-v" id="v-gpu-n">--</span>
    <span class="vit-bar"><i id="v-gpu-b"></i></span>
  </div>
  <div class="vit" id="v-mem" hidden>
    <span class="vit-k">MEM</span>
    <span class="vit-v" id="v-mem-n">--</span>
    <span class="vit-bar"><i id="v-mem-b"></i></span>
  </div>
  <div class="vit" id="v-bat" hidden>
    <span class="vit-k">BAT</span>
    <span class="vit-v" id="v-bat-n">--</span>
    <span class="vit-bar"><i id="v-bat-b"></i></span>
  </div>

  <span class="rule-fill"></span>

  <span class="vit-flag" id="v-flag" hidden></span>
  <!-- Names the process driving the GPU, but only while the GPU cell is high;
       empty (and hidden) otherwise, exactly like the CPU/mem offender beside it. -->
  <span class="vit-hot" id="v-gpu-hot"></span>
  <span class="vit-hot" id="v-hot"></span>
</section>

<!-- Claude subscription usage, directly on top of the focus band because the
     two answer the same question at different scales: this strip says which
     account to work in, the band says what the work is. The verdict leads on
     the left and the per-account bars support it on the right — the panel is
     read once, at the moment a session starts, so the answer is the biggest
     thing in it. Hidden whenever State carries no usage object: an unenrolled
     machine has nothing to show, and an absent usage.json is normal. -->
<section class="panel usage" id="p-usage" hidden>
  <div class="phead">
    <span class="lab">CLAUDE USAGE</span>
    <span class="rule-fill"></span>
    <span class="phead-meta" id="usage-meta"></span>
  </div>
  <div class="pbody usage-body">
    <div class="uverdict" id="u-verdict">
      <p class="uverdict-eyebrow" id="u-verdict-eyebrow"></p>
      <p class="uverdict-line" id="u-verdict-line">—</p>
      <p class="uverdict-sub" id="u-verdict-sub"></p>
    </div>
    <!-- One cell per enrolled account, built by renderUsage. The slots are
         dynamic (enrollment is user data), unlike the verdict's fixed spans. -->
    <div class="uaccts" id="u-accounts"></div>
  </div>
</section>

<div class="band">
  <section class="panel focus" id="p-focus">
    <div class="phead">
      <span class="lab">FOCUS</span>
      <span class="rule-fill"></span>
      <span class="phead-meta" id="focus-src"></span>
    </div>
    <div class="pbody focus-body">
      <p class="focus-eyebrow" id="focus-eyebrow"></p>
      <p class="focus-text" id="focus-text">—</p>
      <!-- The attention census. The number is how many things are stopped on a
           human; the strip is one mark per thing, demand before the divider,
           working sessions after it. Ids keep the load- prefix: the slot is the
           same, the instrument in it changed. -->
      <!-- One line, not two. With the capacity track gone the marks are only as
           wide as there is something to say, so the caption sits beside them and
           the row reads as a single statement: how much is stopped on you, the
           marks that make up the census, and what they are. -->
      <div class="load">
        <span class="load-k">ATTN</span>
        <span class="load-n" id="load-n">--</span>
        <div class="load-strip" id="load-strip"></div>
        <p class="load-cap" id="load-cap"></p>
      </div>
      <!-- Where the load is, not just how much. The panel had the room and was
           carrying one aggregate line that named no context. -->
      <div class="load-ctx" id="load-ctx"></div>
    </div>
  </section>

  <section class="panel hero" id="p-hero">
    <div class="phead">
      <span class="lab" id="hero-label">—</span>
      <span class="rule-fill"></span>
    </div>
    <div class="pbody hero-body">
      <span class="hero-num" id="hero-num">--</span>
      <span class="hero-sub" id="hero-sub"></span>
    </div>
  </section>
</div>

<main class="main">

  <section class="panel runs" id="p-runs">
    <div class="phead">
      <span class="lab">RUNS</span>
      <span class="rule-fill"></span>
      <span class="phead-meta" id="runs-count"></span>
    </div>
    <!-- Its own row, not a slot in the header: .phead is a 26px flex line whose
         counter is already nowrap and can read "05 RUNS · 02 SILENT · 01 NEEDS
         YOU", with no overflow rule and nothing to clip a key placed inside it.
         Static markup, because the key never changes and rendering it from JS
         would put constant content through the row signature. -->
    <!-- role="group" because ARIA prohibits naming a bare div: it computes as
         `generic`, and an aria-label on `generic` is dropped before it reaches
         any platform accessibility API. -->
    <div class="legend" role="group" aria-label="State and duration key">
      <span><i class="is-running"></i>running</span>
      <span><i class="is-blocked"></i>blocked</span>
      <span><i class="is-failed"></i>failed</span>
      <span><i class="is-todo"></i>todo</span>
      <span><i class="is-done"></i>done</span>
      <i class="sep"></i>
      <span><i class="is-session"></i>session</span>
      <i class="sep"></i>
      <span><b class="k-dur">+5m</b>still running</span>
      <span><b class="k-dur done">5m</b>took that long</span>
    </div>
    <div class="pbody scroll" id="runs-list"></div>
  </section>

  <section class="panel lattice" id="p-lattice">
    <div class="phead">
      <span class="lab">LATTICE</span>
      <span class="rule-fill"></span>
      <span class="phead-meta" id="lattice-meta"></span>
    </div>
    <div class="pbody field" id="lattice-field">
      <canvas id="lattice-canvas"></canvas>
      <span class="field-hint" id="lattice-hint">CLICK FIELD TO EXPAND</span>
    </div>
  </section>

</main>

<div class="warnstrip" id="warnstrip" hidden></div>

<footer class="foot" id="p-foot">
  <div class="foot-stats" id="foot-stats"></div>
  <span class="rule-fill"></span>
  <span class="foot-path" id="foot-path"></span>
  <span class="foot-sync" id="foot-sync"></span>
  <!-- Shown only when the backend booted after this page loaded: fresh State
       through stale renderers is an otherwise invisible failure. -->
  <span class="link-stale" id="link-stale" hidden
        title="The HUD backend restarted after this page loaded, so the page may be running older code. Reload with Cmd+R.">RELOAD</span>
  <span class="link-state" id="link-state"><span class="lamp"></span><span id="link-text">BOOT</span></span>
</footer>

<div class="underlay" aria-hidden="true"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
